# SWARD Moodle Test — Configuración para Coolify
# Valida integración de sward-ms-integracion-lms contra Moodle real
# Imagen: erseco/alpine-moodle:v4.5.11 (LTS, comunidad)
#
# Variables de entorno (sobrescribibles en Coolify UI):
# - MOODLE_ADMIN: admin
# - MOODLE_PASSWORD: cambiar en producción
# - MOODLE_EMAIL: email@tudominio.com
# - SITE_URL: https://moodle.tudominio.com (Coolify asigna automáticamente)

version: '3.9'

services:
  mariadb:
    image: docker.io/library/mariadb:11.4
    container_name: ${COMPOSE_PROJECT_NAME:-sward-moodle}-mariadb
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-moodle}
      MARIADB_USER: ${MARIADB_USER:-moodle}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-moodle_pass_change_me}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root_pass_change_me}
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
      - "--max_connections=500"
      - "--max_allowed_packet=256M"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    restart: unless-stopped
    networks:
      - sward-network
    labels:
      # Metadatos para Coolify (opcional, facilita auto-discovery)
      coolify.service: "mariadb"
      coolify.description: "Base de datos MariaDB para Moodle"

  moodle:
    image: docker.io/erseco/alpine-moodle:v4.5.11
    container_name: ${COMPOSE_PROJECT_NAME:-sward-moodle}-app
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "${MOODLE_PORT:-8090}:8080"
    environment:
      # Base de datos
      DB_TYPE: mariadb
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: ${MARIADB_DATABASE:-moodle}
      DB_USER: ${MARIADB_USER:-moodle}
      DB_PASS: ${MARIADB_PASSWORD:-moodle_pass_change_me}
      # Admin
      MOODLE_USERNAME: ${MOODLE_ADMIN:-admin}
      MOODLE_PASSWORD: ${MOODLE_PASSWORD:-Sward2026!}
      MOODLE_EMAIL: ${MOODLE_EMAIL:-admin@sward.test}
      MOODLE_SITENAME: ${MOODLE_SITENAME:-SWARD Moodle Test}
      # URL (Coolify inyecta automáticamente $COOLIFY_DOMAIN_NAME)
      SITE_URL: ${SITE_URL:-http://localhost:8090}
    volumes:
      - moodledata_data:/var/www/moodledata
      - moodlehtml_data:/var/www/html
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/login/index.php || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 30
      start_period: 300s
    restart: unless-stopped
    networks:
      - sward-network
    labels:
      coolify.service: "moodle"
      coolify.description: "Moodle LMS para pruebas de integración SWARD"
      coolify.port: "8080"

volumes:
  mariadb_data:
    driver: local
  moodledata_data:
    driver: local
  moodlehtml_data:
    driver: local

networks:
  sward-network:
    driver: bridge

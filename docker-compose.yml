# Entorno Moodle dockerizado para pruebas del MVP de SWARD.
# Valida la integracion del microservicio sward-ms-integracion-lms
# contra una instancia REAL de Moodle (no el mock).
#
# Imagen: erseco/alpine-moodle (comunidad, mantenida activamente).
# Bitnami retiro sus imagenes gratuitas de Docker Hub en 2025.
#
# NOTA: Estas credenciales son SOLO para un entorno de prueba local.
# Nunca usar estos valores en produccion.

services:
  mariadb:
    image: docker.io/library/mariadb:11.4
    container_name: sward-moodle-mariadb
    environment:
      - MARIADB_DATABASE=moodle
      - MARIADB_USER=moodle
      - MARIADB_PASSWORD=moodle_pass
      - MARIADB_ROOT_PASSWORD=root_pass
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  moodle:
    # Moodle 4.5 LTS (soporte extendido). Version fija para reproducibilidad.
    # Tags disponibles: v4.5.11, v5.0.x, v5.1.x, v5.2.0, latest.
    image: docker.io/erseco/alpine-moodle:v4.5.11
    container_name: sward-moodle-app
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      # --- Conexion a la base de datos ---
      - DB_TYPE=mariadb
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_NAME=moodle
      - DB_USER=moodle
      - DB_PASS=moodle_pass
      # --- Cuenta de administrador (credenciales de prueba) ---
      - MOODLE_USERNAME=admin
      - MOODLE_PASSWORD=Sward2026Change
      - MOODLE_EMAIL=admin@sward.test
      # --- URL externa (local): debe coincidir con el puerto publicado (8090) ---
      - SITE_URL=http://localhost:8090
    volumes:
      - moodledata_data:/var/www/moodledata
      - moodlehtml_data:/var/www/html
    healthcheck:
      # La imagen alpine trae wget; no asume curl.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/login/index.php || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 30
      start_period: 300s
    restart: unless-stopped

volumes:
  mariadb_data:
    driver: local
  moodledata_data:
    driver: local
  moodlehtml_data:
    driver: local
